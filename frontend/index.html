         small sizes, with real tabular figures so rainfall values align when
         scanned down a column. Inter was tried first and drew hyphens with
         wide sidebearings that read as spaces at this size ("Regime - aware").
         Source Serif 4 is used for the one display number only, to give the
         reading a focal point without relying on weight alone. -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
